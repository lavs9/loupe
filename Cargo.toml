[package]
name = "loupe"
version = "0.3.0"
edition = "2021"
description = "Search photos, clips, and songs on this Mac and on disks you plug in. The index lives next to the files."

[features]
# The window pulls in GPUI. The command-line build stays the default.
gui = ["dep:gpui-apple-hig", "dep:gpui-kit", "dep:global-hotkey", "dep:rfd", "dep:tray-icon", "dep:notify", "dep:objc"]

[dependencies]
objc = { version = "0.2.7", optional = true }
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
blake3 = { version = "1.5", features = ["mmap", "rayon"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp", "gif"] }
jwalk = "0.8"
kamadak-exif = "0.5"
libc = "0.2"
libloading = "0.8"
nfsserve = "0.11.0"
rayon = "1.10"
regex = "1.11"
rusqlite = { version = "0.32", features = ["bundled", "vtab"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlite-vec = "0.1.9"
tokio = { version = "1.40", features = ["full"] }
ureq = { version = "2.12", features = ["json"] }
tracing = "0.1"
tracing-subscriber = "0.3"
zerocopy = { version = "0.8", features = ["derive"] }
gpui-apple-hig = { path = "../gpui-apple-hig", optional = true }
gpui-kit = { version = "0.7.3", optional = true }
global-hotkey = { version = "0.8", optional = true }
rfd = { version = "0.15", optional = true }
tray-icon = { version = "0.26.1", optional = true, default-features = false }
notify = { version = "7", optional = true }
pdf-extract = "0.12"
id3 = "1.17"
zip = { version = "2", default-features = false, features = ["deflate"] }
